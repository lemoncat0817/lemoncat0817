name: update-cat

on:
  schedule:
    - cron: '5 16 * * *'
    - cron: '5 22 * * *'
    - cron: '5 3 * * *'
    - cron: '5 6 * * *'
    - cron: '5 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: 更新貓咪橫幅"
          git push
