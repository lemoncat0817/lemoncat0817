name: update-cat

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update.yml']
  # 備援：主要觸發是 worker/ 的外部排程，這裡避開整點負載高峰
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 推送與排程可能同時觸發，排隊執行才不會互相推送衝突
concurrency:
  group: update-cat
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 取 main 最新版而非觸發當下的 commit，排隊期間前一輪推的圖檔才不會造成分叉
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "chore: 更新貓咪橫幅"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
