<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="檸檬貓 Lemoncat. Cats sleep around 12 to 16 hours a day. Cats can't taste sweetness. The gene for their sweet receptor doesn't work. Adult cats rarely meow at each other. Most meows are meant for humans.">
<style>
text{font-family:'Noto Sans CJK TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
@media (prefers-reduced-motion:no-preference){
.blink{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
.tail{transform-box:fill-box;transform-origin:0% 95%;animation:tail 2.4s ease-in-out infinite}
.heart{animation:zzz 2.6s ease-in-out infinite}
.breathe{transform-box:fill-box;transform-origin:50% 100%}
.head{transform-box:fill-box;transform-origin:50% 100%}
.yawn{transform-box:fill-box;transform-origin:50% 0%;animation:yawn 6s ease-in-out infinite}
.zzz{animation:zzz 3.2s ease-in-out infinite}
.packet{transform-box:fill-box;transform-origin:50% 0%;animation:sway 3s ease-in-out infinite}
.moon{animation:glow 4s ease-in-out infinite}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .5s ease-in-out infinite alternate}
.conf{animation:fall 4s linear infinite}
.look{animation:look 9s ease-in-out infinite}
.breathe{--b:1.025;animation:breathe 4s ease-in-out infinite}



}
.yawn{opacity:0}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes look{0%,35%,100%{transform:translateX(0)}42%,60%{transform:translateX(7px)}68%,85%{transform:translateX(-6px)}}
@keyframes lookchase{0%,100%{transform:translate(5px,-3px)}25%{transform:translate(7px,-5px)}50%{transform:translate(6px,2px)}75%{transform:translate(3px,-1px)}}
@keyframes tail{0%,40%,100%{transform:rotate(0)}12%{transform:rotate(8deg)}22%{transform:rotate(-3deg)}31%{transform:rotate(5deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(var(--b))}}
@keyframes stretch{0%,100%{transform:scale(1)}30%,60%{transform:scale(.96,1.09)}}
@keyframes yawn{0%,28%{opacity:0;transform:scaleY(.2)}36%,56%{opacity:1;transform:scaleY(1)}64%,100%{opacity:0;transform:scaleY(.2)}}
@keyframes chomp{0%,78%,100%{transform:translateY(0)}10%,30%,50%{transform:translateY(52px)}20%,40%,60%{transform:translateY(46px)}}
@keyframes nod{0%,100%{transform:rotate(0)}55%,78%{transform:rotate(-7deg) translateY(4px)}}
@keyframes track{0%,100%{transform:rotate(3deg)}25%{transform:rotate(5deg)}50%{transform:rotate(1deg)}75%{transform:rotate(2deg)}}
@keyframes zzz{0%{opacity:0;transform:translateY(8px)}30%,70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes swing{from{transform:rotate(-12deg)}to{transform:rotate(28deg)}}
@keyframes roll{from{transform:translate(150px,206px)}to{transform:translate(198px,206px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(320deg)}}
@keyframes flicker{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.85,1.12) rotate(4deg)}}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(240px) rotate(300deg);opacity:1}}
@keyframes wash{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-26px) rotate(-14deg)}}
@keyframes push{0%,15%,60%,100%{transform:translateX(0)}30%,38%{transform:translateX(22px)}}
@keyframes cup{0%,30%{transform:none;opacity:1}40%{transform:rotate(75deg);opacity:1}62%{transform:translate(14px,80px) rotate(160deg);opacity:0}85%{transform:none;opacity:0}100%{transform:none;opacity:1}}
@keyframes read{0%{transform:translate(-5px,3px)}80%{transform:translate(5px,3px)}100%{transform:translate(-5px,5px)}}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes fly{0%{transform:translate(168px,46px)}25%{transform:translate(192px,22px)}50%{transform:translate(182px,74px)}75%{transform:translate(150px,52px)}100%{transform:translate(168px,46px)}}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@media (prefers-reduced-motion:no-preference){
.sun{animation:sunspin 24s linear infinite}
.star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.cloud{animation:drift 9s ease-in-out infinite alternate}
.cloud.slow{animation-duration:13s}
.drop{animation:rain .9s linear infinite}
.bolt{animation:bolt 5s steps(1) infinite}
}
.drop{opacity:0}
@media (prefers-reduced-motion:reduce){.drop{opacity:1;transform:translateY(80px)}}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes rain{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(230px);opacity:.8}}
@keyframes bolt{0%,86%,92%,100%{opacity:0}88%,94%{opacity:1}}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

@keyframes tz0_0{0%,2.63%{transform:scaleX(0);animation-timing-function:steps(20)}10.53%,28.07%{transform:scaleX(1);animation-timing-function:steps(20)}31.14%,100%{transform:scaleX(0)}}
#tz0_0{transform-box:fill-box;transform-origin:left;animation:tz0_0 22.80s infinite}
@keyframes tz1_0{0%,33.77%{transform:scaleX(0);animation-timing-function:steps(26)}44.04%,61.58%{transform:scaleX(1);animation-timing-function:steps(26)}65.57%,100%{transform:scaleX(0)}}
#tz1_0{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:tz1_0 22.80s infinite}
@keyframes tz2_0{0%,68.20%{transform:scaleX(0);animation-timing-function:steps(26)}78.46%,96.01%{transform:scaleX(1);animation-timing-function:steps(26)}100.00%,100%{transform:scaleX(0)}}
#tz2_0{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:tz2_0 22.80s infinite}
@keyframes te0_0{0%,1.64%{transform:scaleX(0);animation-timing-function:steps(39)}11.24%,22.19%{transform:scaleX(1);animation-timing-function:steps(39)}25.92%,100%{transform:scaleX(0)}}
#te0_0{transform-box:fill-box;transform-origin:left;animation:te0_0 36.55s infinite}
@keyframes te1_0{0%,27.56%{transform:scaleX(0);animation-timing-function:steps(52)}40.37%,58.84%{transform:scaleX(1);animation-timing-function:steps(52)}63.82%,100%{transform:scaleX(0)}}
#te1_0{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:te1_0 36.55s infinite}
@keyframes te1_1{0%,40.37%{transform:scaleX(0);animation-timing-function:steps(22)}45.79%,56.73%{transform:scaleX(1);animation-timing-function:steps(22)}58.84%,100%{transform:scaleX(0)}}
#te1_1{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:te1_1 36.55s infinite}
@keyframes te2_0{0%,65.46%{transform:scaleX(0);animation-timing-function:steps(58)}79.74%,94.45%{transform:scaleX(1);animation-timing-function:steps(58)}100.00%,100%{transform:scaleX(0)}}
#te2_0{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:te2_0 36.55s infinite}
@keyframes te2_1{0%,79.74%{transform:scaleX(0);animation-timing-function:steps(11)}82.45%,93.39%{transform:scaleX(1);animation-timing-function:steps(11)}94.45%,100%{transform:scaleX(0)}}
#te2_1{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:te2_1 36.55s infinite}
</style>
