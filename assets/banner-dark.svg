  <switch><g systemLanguage="zh,zh-TW,zh-HK,zh-MO,zh-CN,zh-SG,zh-Hant,zh-Hans,zh-Hant-TW,zh-Hans-CN"><text font-size="40" font-weight="800" fill="#e6edf3" y="0">檸檬貓 <tspan fill="#9198a1" font-weight="500" font-size="26">Lemoncat</tspan></text></g><g><text font-size="40" font-weight="800" fill="#e6edf3" y="0">Lemoncat <tspan fill="#9198a1" font-weight="500" font-size="26">檸檬貓</tspan></text></g></switch>
  <g transform="translate(0 36)"><circle class="dot" cx="5" cy="-5" r="4.5" fill="#9198a1"/><switch><g systemLanguage="zh,zh-TW,zh-HK,zh-MO,zh-CN,zh-SG,zh-Hant,zh-Hans,zh-Hant-TW,zh-Hans-CN"><text x="18" font-size="14" fill="#9198a1">貓咪睡覺中，請輕聲細語</text></g><g><text x="18" font-size="14" fill="#9198a1">The cat is asleep. Please keep it down</text></g></switch></g>
  <g transform="translate(0 82)">
    <switch><g systemLanguage="zh,zh-TW,zh-HK,zh-MO,zh-CN,zh-SG,zh-Hant,zh-Hans,zh-Hant-TW,zh-Hans-CN"><text font-size="13" fill="#9198a1" font-weight="700" y="-8" letter-spacing="1">今日貓咪冷知識</text><clipPath id="clip-tz0_0"><rect id="tz0_0" x="0" y="0" width="319" height="28"/></clipPath>
<text x="0" y="20" font-size="17" fill="#e6edf3" clip-path="url(#clip-tz0_0)">貓一天大約要睡 12 到 16 個小時。</text><clipPath id="clip-tz1_0"><rect id="tz1_0" x="0" y="0" width="515" height="28"/></clipPath>
<text x="0" y="20" font-size="17" fill="#e6edf3" clip-path="url(#clip-tz1_0)">貓嚐不到甜味，負責甜味受體的基因在牠們身上是壞掉的。</text><clipPath id="clip-tz2_0"><rect id="tz2_0" x="0" y="0" width="515" height="28"/></clipPath>
<text x="0" y="20" font-size="17" fill="#e6edf3" clip-path="url(#clip-tz2_0)">成年的貓彼此之間很少喵喵叫，「喵」大多是叫給人聽的。</text></g><g><text font-size="13" fill="#9198a1" font-weight="700" y="-8" letter-spacing="0.6">CAT FACT OF THE DAY</text><clipPath id="clip-te0_0"><rect id="te0_0" x="0" y="0" width="388" height="28"/></clipPath>
<text x="0" y="20" font-size="17" fill="#e6edf3" clip-path="url(#clip-te0_0)">Cats sleep around 12 to 16 hours a day.</text><clipPath id="clip-te1_0"><rect id="te1_0" x="0" y="0" width="515" height="28"/></clipPath>
<text x="0" y="20" font-size="17" fill="#e6edf3" clip-path="url(#clip-te1_0)">Cats can't taste sweetness. The gene for their sweet</text><clipPath id="clip-te1_1"><rect id="te1_1" x="0" y="28" width="222" height="28"/></clipPath>
<text x="0" y="48" font-size="17" fill="#e6edf3" clip-path="url(#clip-te1_1)">receptor doesn't work.</text><clipPath id="clip-te2_0"><rect id="te2_0" x="0" y="0" width="573" height="28"/></clipPath>
<text x="0" y="20" font-size="17" fill="#e6edf3" clip-path="url(#clip-te2_0)">Adult cats rarely meow at each other. Most meows are meant</text><clipPath id="clip-te2_1"><rect id="te2_1" x="0" y="28" width="114" height="28"/></clipPath>
<text x="0" y="48" font-size="17" fill="#e6edf3" clip-path="url(#clip-te2_1)">for humans.</text></g></switch>
