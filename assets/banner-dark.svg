<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="Lemoncat 檸檬貓：網頁工程師。今日冷知識：貓從高處掉下來時，會在空中把身體翻正再落地。">
<style>
text{font-family:'Noto Sans CJK TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
@media (prefers-reduced-motion:no-preference){
.blink{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
.look{animation:look 9s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:0% 95%;animation:tail 5.3s ease-in-out infinite}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.zzz{animation:zzz 3.2s ease-in-out infinite}
.dot{animation:pulse 2.4s ease-in-out infinite}
}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes look{0%,35%,100%{transform:translateX(0)}42%,60%{transform:translateX(7px)}68%,85%{transform:translateX(-6px)}}
@keyframes tail{0%,40%,100%{transform:rotate(0)}12%{transform:rotate(8deg)}22%{transform:rotate(-3deg)}31%{transform:rotate(5deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes zzz{0%{opacity:0;transform:translateY(8px)}30%,70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes type0{0%,7.50%{transform:scaleX(0);animation-timing-function:steps(22)}19.88%,93%{transform:scaleX(1)}94%,100%{transform:scaleX(0)}}
#c0{transform-box:fill-box;transform-origin:left;animation:type0 16s infinite}
</style>
